<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Game</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="./js/script.js" defer></script>
</head>

<body>
    <header>
        <h1>Typing Speed Test Game</h1>
    </header>
    <main class="container">
        <input type="text" id="typing-input" autocomplete="off">
        <div class="quote-container">
            <p></p>
        </div>
        <div class="controls">
            <p>Time Left: <span id="time-left">60</span>s</p>
            <p>Correct: <span id="char-correct">0</span></p>
            <p>Incorrect: <span id="char-incorrect">0</span></p>
            <p>WPM: <span id="wordsperminute">0</span></p>
            <p>CPM: <span id="charactersperminute">0</span></p>
            <button id="play-btn" >Play <i class="fa-solid fa-play"></i></button>
            <button id="reset-btn" class="hidden">Try Again <i class="fa-solid fa-arrow-rotate-left"></i></button>
        </div>
    </main>
</body>

</html>
